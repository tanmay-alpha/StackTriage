name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0"
      - run: pip install -e ".[api,ml,dev]"
      - run: python -m pytest
      - run: python -m pytest scripts/demo_test.py
      - run: python scripts/acceptance_report.py
      - run: python scripts/evaluate_anomaly.py
      - run: pip install pip-audit && pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0"
      - run: pip install -e ".[api,ml,dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: docker build -t stacktriage:verify .
      - name: Audit Python packages inside the production image
        run: >
          docker run --rm --entrypoint sh stacktriage:verify -c
          "pip install -q --user pip-audit && python -m pip_audit --skip-editable"
      - name: Scan the production image for fixable HIGH/CRITICAL OS and Python CVEs
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" aquasec/trivy:0.76.2
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /trivyignore.yaml stacktriage:verify
      - name: Start, authenticate, import, restart, recreate, backup and restore on a named volume
        run: python scripts/docker_verify.py --image stacktriage:verify
