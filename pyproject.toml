[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stacktriage"
version = "0.1.0"
description = "Triage application logs: parse Python/Node/Java/JSONL/CSV logs, group errors, build incident timelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.121", "uvicorn>=0.30", "sqlalchemy>=2.0"]
ml = ["scikit-learn>=1.4", "numpy>=1.26"]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
stacktriage = "stacktriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
